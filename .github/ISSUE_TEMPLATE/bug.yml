name: 缺陷报告
description: 报告可复现的软件问题（安全漏洞请勿使用）
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        请勿上传数据库、备份、完整日志、密钥、真实姓名、案号或客户截图。安全漏洞请使用 Security 页面的私密报告入口。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: V2.1.0 / commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 环境
      options:
        - Windows 11
        - Windows 10
        - macOS 开发环境
        - Linux 开发环境
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用合成或脱敏数据，按顺序列出操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏诊断信息
      description: 只粘贴与问题直接相关且已移除个人信息、内网地址和凭据的最小片段。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 这不是安全漏洞；如涉及安全问题，我会改用私密漏洞报告。
          required: true
        - label: 我没有附加数据库、备份、密钥、真实个人信息或未脱敏客户资料。
          required: true
