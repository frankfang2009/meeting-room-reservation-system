name: 功能提案
description: 提议一个范围清晰的产品或维护改进
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么工作流中遇到了什么问题？请勿包含真实个人或客户数据。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 数据、权限与部署影响
      description: 是否影响角色权限、数据库、公开大屏、局域网或 Windows 安装/恢复？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 方案不要求 V2 读取、迁移、修改或删除 V1 数据。
          required: true
        - label: 方案不要求在公开位置上传客户数据或真实个人信息。
          required: true
