name: V2 release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v2.*"

permissions:
  contents: read

concurrency:
  group: v2-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-linux:
    name: candidate-linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Accept only main or a matching V2 tag
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v2.*) ;;
            *) echo "release candidates may only run from main or a v2.* tag"; exit 1 ;;
          esac
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Match a tag to v2/VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < v2/VERSION)"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            v2/backend/requirements.txt
            v2/backend/requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install --requirement v2/backend/requirements.txt --requirement v2/backend/requirements-dev.txt
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json
      - name: Verify source before candidate build
        shell: bash
        run: |
          python -m ruff check v2/backend v2/installer v2/tests
          python -m unittest discover -s v2/installer/tests -v
          python -m unittest discover -s v2/tests -v
          (cd v2/frontend && npm ci && npm run check)
      - name: Rebuild source-to-candidate twice
        shell: bash
        env:
          CANDIDATE_OUTPUT: ${{ runner.temp }}/meeting-room-v2-candidate
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/meeting-room-v2-approved-inputs"
          mkdir -p "$input_root/wheels"
          python -m pip download \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --platform win_amd64 \
            --python-version 313 \
            --implementation cp \
            --abi cp313 \
            --dest "$input_root/wheels" \
            --requirement v2/backend/requirements-win-amd64.lock
          curl --fail --location --silent --show-error \
            --output "$input_root/python-3.13.14-embed-amd64.zip" \
            https://www.python.org/ftp/python/3.13.14/python-3.13.14-embed-amd64.zip
          .github/scripts/v2-reproducible-build.sh \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/meeting-room-v2-independent-builds" \
            "$input_root/python-3.13.14-embed-amd64.zip" \
            "$input_root/wheels" \
            "$CANDIDATE_OUTPUT"
      - name: Upload candidate six-pack for controlled validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meeting-room-v2-candidate
          path: ${{ runner.temp }}/meeting-room-v2-candidate
          if-no-files-found: error
          retention-days: 7

  candidate-windows:
    name: candidate-windows
    needs: candidate-linux
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download candidate six-pack
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: meeting-room-v2-candidate
          path: ${{ runner.temp }}/meeting-room-v2-candidate
      - name: Gate real zero-argument candidate entrypoints
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "v2/VERSION" -Raw -Encoding UTF8).Trim()
          .github/scripts/v2-windows-candidate-gate.ps1 -CandidateZip "${{ runner.temp }}/meeting-room-v2-candidate/会议室预约系统-V$version-安装包.zip" -WorkRoot "${{ runner.temp }}/meeting-room-v2-windows-gate"
