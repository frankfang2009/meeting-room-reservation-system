name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Check public repository contracts
        run: python -m unittest v2.tests.test_open_source_contract -v
      - name: Check whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root "$PUSH_HEAD_SHA"
          else
            git diff --check "$PUSH_BEFORE_SHA..$PUSH_HEAD_SHA"
          fi

  v2-linux:
    name: v2-linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            v2/backend/requirements.txt
            v2/backend/requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install --requirement v2/backend/requirements.txt --requirement v2/backend/requirements-dev.txt
      - name: Python static gate
        run: python -m ruff check v2/backend v2/installer v2/tests
      - name: Backend tests
        working-directory: v2/backend
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -v
      - name: Installer tests
        run: python -m unittest discover -s v2/installer/tests -v
      - name: Cross-layer contracts
        run: python -m unittest discover -s v2/tests -v
      - name: Python compile gate
        run: python -m compileall -q v2/backend v2/installer v2/tests
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: v2/frontend
        run: npm ci
      - name: Frontend contracts and build
        working-directory: v2/frontend
        run: npm run check
      - name: Audit runtime frontend dependencies
        working-directory: v2/frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Production bundle leak gate
        shell: bash
        run: |
          if grep -R -E "demo123|TEST-2026|INITIAL_CALENDAR_BOOKINGS|/api/v2" v2/frontend/dist/client; then
            echo "production bundle contains forbidden synthetic state"
            exit 1
          fi
  v2-windows:
    name: v2-windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Installer and cross-layer tests
        run: |
          python -m unittest discover -s v2/installer/tests -v
          python -m unittest discover -s v2/tests -v
          python -m compileall -q v2/backend v2/installer v2/tests
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json
      - name: Frontend contracts and build
        working-directory: v2/frontend
        run: |
          npm ci
          npm run check
